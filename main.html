    background:#0e6b60;
    color:#fff;

  #searchbar .count{color:#bfe6df;font-size:11px;margin-top:4px;text-align:right;}

  #messages{
    flex:1;
    overflow-y:auto;
    padding:14px 8px 18px 8px;
  }

  .date-sep{
    text-align:center;

    background:#e7f3f7;

    margin:10px 0;
  }

    background:var(--wa-system);
    color:#4b6a72;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:8px;
    display:inline-block;
    max-width:85%;
  }

  .row{
    display:flex;
    margin:2px 6px;
  }
  .row.them{justify-content:flex-start;}
  .row.me{justify-content:flex-end;}

  .bubble{
    max-width:76%;
    padding:6px 9px 8px 9px;
    border-radius:8px;
    position:relative;
    font-size:14.3px;
    line-height:1.35;
    color:var(--wa-text);
    box-shadow:0 1px 0.5px rgba(0,0,0,.13);
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.them .bubble{background:var(--wa-them); border-top-left-radius:2px;}
  .row.me .bubble{background:var(--wa-me); border-top-right-radius:2px;}
  .row.grouped .bubble{border-radius:8px;}
  .row.them.grouped .bubble{border-top-left-radius:8px;}
  .row.me.grouped .bubble{border-top-right-radius:8px;}

  .sender-name{
    font-size:12.8px;
    font-weight:600;
    margin-bottom:2px;
    display:block;
  }
  .sender-name.s1{color:var(--name1-color);}
  .sender-name.s2{color:var(--name2-color);}

  .msg-text{display:inline;}
  .meta{
    float:right;
    margin:4px 0 -4px 8px;
    font-size:11px;
    color:var(--wa-sub);
    white-space:nowrap;
  }
  .media-placeholder{
    display:flex;
    align-items:center;
    gap:6px;
    color:#5b6b73;
    font-style:italic;
    font-size:13.5px;

  .redacted{
    color:#8a5a5a;
    font-style:italic;
  }

  #messages::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px;}

  .highlight{background:#ffe98a;border-radius:2px;padding:0 1px;}

  #jump-latest{
    position:absolute;
    bottom:16px;right:16px;
    background:#fff;
    border-radius:50%;
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.3);

    color:#3a5f4a;

  }

  footer-note{}
  #empty-state{

<script>
const raw = JSON.parse(document.getElementById('chatdata').textContent);

// Assign visual "me" side — the more frequent narrator on the right, like a real WA export
const ME_SENDER = "Vyshakh Anand";
const nameClass = {};
nameClass["Skidukadi Shajan"] = "s1";
nameClass["Vyshakh Anand"] = "s2";

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function linkify(text){
  const urlRe = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRe, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}

function renderText(m){
  if (m.text === "[message removed]"){
    return `<span class="redacted">&#128683; message withheld</span>`;
  }
  if (m.text.trim() === "<Media omitted>"){
    return `<span class="media-placeholder"><span class="icon">&#128247;</span> Media omitted</span>`;
  }
  if (/^You deleted this message$/i.test(m.text.trim()) || /^This message was deleted$/i.test(m.text.trim())){
    return `<span class="deleted"><span class="icon">&#8856;</span>${escapeHtml(m.text)}</span>`;
  }
  return linkify(escapeHtml(m.text)).replace(/\n/g, '<br>');
}

// build DOM
const container = document.getElementById('messages');
let lastDate = null;
let lastSender = null;
const frag = document.createDocumentFragment();

if (raw.length === 0){
  const empty = document.createElement('div');
  empty.id = 'empty-state';
  empty.textContent = 'No messages found.';
  container.appendChild(empty);
}

raw.forEach((m, idx) => {
  if (m.date !== lastDate){
    const sep = document.createElement('div');
    sep.className = 'date-sep';
    sep.innerHTML = `<span>${m.date}</span>`;
    frag.appendChild(sep);
    lastDate = m.date;
    lastSender = null;
  }

  if (m.type === 'system'){
    const sys = document.createElement('div');
    sys.className = 'system-msg';
    sys.innerHTML = `<span>${escapeHtml(m.text)}</span>`;
    frag.appendChild(sys);
    lastSender = null;
    return;
  }

  const isMe = m.sender === ME_SENDER;
  const grouped = m.sender === lastSender;
  const row = document.createElement('div');
  row.className = `row ${isMe ? 'me':'them'} ${grouped ? 'grouped':''}`;
  row.dataset.idx = idx;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  let nameHtml = '';
  if (!grouped){
    nameHtml = `<span class="sender-name ${nameClass[m.sender]||''}">${escapeHtml(m.sender)}</span>`;
  }

  bubble.innerHTML = `${nameHtml}<span class="msg-text">${renderText(m)}</span><span class="meta">${m.time}</span>`;
  row.appendChild(bubble);
  frag.appendChild(row);
  lastSender = m.sender;
});

container.appendChild(frag);
container.scrollTop = container.scrollHeight;

document.getElementById('jump-latest').addEventListener('click', () => {
  container.scrollTop = container.scrollHeight;
});

// search
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');
let matches = [];
let matchIdx = -1;

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  // clear old highlights
  container.querySelectorAll('.msg-text .highlight').forEach(h => {
    h.outerHTML = h.innerHTML;
  });
  matches = [];
  matchIdx = -1;
  if (!q){
    searchCount.textContent = '';
    return;
  }
  const rows = container.querySelectorAll('.row');
  rows.forEach(row => {
    const span = row.querySelector('.msg-text');
    if (!span) return;
    const text = span.textContent.toLowerCase();
    if (text.includes(q)){
      matches.push(row);
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
      span.innerHTML = span.innerHTML.replace(re, '<span class="highlight">$1</span>');
    }
  });
  searchCount.textContent = matches.length ? `${matches.length} matches` : 'No matches';
  if (matches.length){
    matches[0].scrollIntoView({block:'center'});
  }
});
</script>
</body>
</html>
